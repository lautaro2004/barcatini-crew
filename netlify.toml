# Netlify detecta Next.js y usa su runtime oficial automáticamente.
[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Cache largo para recursos estáticos pesados (fotos, logos, fuente, audio)
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sponsors/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
